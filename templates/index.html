<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SafeRouteAI Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="header">
                <h2>SafeRouteAI</h2>
                <span class="user-info">Hi, {{ user }} | <a href="/logout">Logout</a></span>
            </div>

            <div class="controls">
                <div class="controls">
                    <div class="autocomplete-container">
                        <input type="text" id="origin" placeholder="Origin (e.g. Manila)" autocomplete="off">
                        <div id="origin-suggestions" class="suggestions-box"></div>
                    </div>

                    <div class="autocomplete-container">
                        <input type="text" id="destination" placeholder="Destination (e.g. Quezon City)" autocomplete="off">
                        <div id="destination-suggestions" class="suggestions-box"></div>
                    </div>
                    
                    <label for="commuter-type">Commuter Type:</label>
                    <select id="commuter-type">
                        <option value="car">Car (Moderate Flood Tolerance)</option>
                        <option value="jeepney">Jeepney (High Flood Tolerance)</option>
                        <option value="tricycle">Tricycle (Low Flood Tolerance)</option>
                    </select>

                    <button id="find-routes-btn" class="btn-primary">Find Safe Routes</button>
                </div>
            </div>

            <div id="route-results" class="route-results">
            <!-- Route Cards will be injected here via JS -->
            </div>
        </div>

        <!-- Map Container -->
        <div id="map" style="height: 100%; width: 100%; background: #ebebeb;"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
