<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SafeRouteAI Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="header">
                <h2>SafeRouteAI</h2>
                <span class="user-info">Hi, {{ user }} | <a href="/logout">Logout</a></span>
            </div>

            <div class="controls">
                <label class="input-label">Starting Location:</label>
                <div class="autocomplete-container input-with-icon">
                    <input type="text" id="origin" placeholder="Enter Location Manually." autocomplete="off">
                    <button type="button" id="locate-me-btn" title="Use Current Location">🎯</button>
                    <div id="origin-suggestions" class="suggestions-box"></div>
                </div>

                <label class="input-label">Destination:</label>
                <div class="autocomplete-container">
                    <input type="text" id="destination" placeholder="Enter Location Destination." autocomplete="off">
                    <div id="destination-suggestions" class="suggestions-box"></div>
                </div>
                
                <label class="input-label">Commuter Type:</label>
                <select id="commuter-type">
                    <option value="car">Car</option>
                    <option value="jeepney">Jeepney</option>
                    <option value="tricycle">Tricycle</option>
                </select>

                <button id="find-routes-btn" class="btn-primary">Find Safe Routes</button>
            </div>

            <div id="route-results" class="route-results">
            <!-- Route Cards will be injected here via JS -->
            </div>
        </div>
        <!-- Map Container -->
        <div class="map-area">
            <!-- This is your existing map div -->
            <div id="map" style="height: 100%; width: 100%; background: #ebebeb;"></div>

            <div class="map-overlay-controls">
                <button id="map-pick-btn" title="Pick points on map">📍</button>
                <!-- NEW: Live Tracking Toggle -->
                <button id="track-me-btn" title="Toggle Live Tracking">🛰️</button>
                <div id="pick-status" class="pick-status-label">Click map for Origin</div>
            </div>

            <!-- This is the new button container that sits ON TOP of the map -->
            <div class="map-overlay-controls">
                <button id="map-pick-btn" title="Pick points on map">📍</button>
                <div id="pick-status" class="pick-status-label">Click map for Origin</div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
